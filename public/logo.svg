<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="brandBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#021c1b" />
    </linearGradient>

    <!-- Golden Metallic Gradient -->
    <linearGradient id="brandGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cyan/Emerald AI Spark Gradient -->
    <linearGradient id="brandAiSparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Inner Shadow / Border Filter -->
    <filter id="brandSubtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#brandBgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- Inner Golden Ornamental Border -->
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="url(#brandGoldGrad)" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="8 4" />

  <!-- Islamic Dome / Mihrab Arch Silhouette -->
  <path d="M64 22 C56 32, 32 46, 32 78 C32 94, 45 102, 64 102 C83 102, 96 94, 96 78 C96 46, 72 32, 64 22 Z" fill="#065f46" fill-opacity="0.4" stroke="url(#brandGoldGrad)" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Open Book of Knowledge (Kitab / Quranic Pages) -->
  <!-- Left Page -->
  <path d="M64 88 C54 84, 40 82, 30 87 C29 74, 30 58, 30 58 C40 54, 54 56, 64 62 Z" fill="url(#brandGoldGrad)" fill-opacity="0.95" />
  <!-- Left Page Fold lines -->
  <path d="M34 63 C43 60, 53 61, 60 66" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />
  <path d="M34 71 C43 68, 53 69, 60 74" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />
  <path d="M34 79 C43 76, 53 77, 60 82" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />

  <!-- Right Page -->
  <path d="M64 88 C74 84, 88 82, 98 87 C99 74, 98 58, 98 58 C88 54, 74 56, 64 62 Z" fill="url(#brandGoldGrad)" fill-opacity="0.95" />
  <!-- Right Page Fold lines -->
  <path d="M94 63 C85 60, 75 61, 68 66" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />
  <path d="M94 71 C85 68, 75 69, 68 74" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />
  <path d="M94 79 C85 76, 75 77, 68 82" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" />

  <!-- Book Spine Center Rib -->
  <path d="M64 60 L64 92" stroke="#451a03" stroke-width="2" stroke-linecap="round" />

  <!-- Top AI Intelligence Node / 8-Pointed Islamic Star -->
  <!-- 8-Pointed Star / Star of Knowledge -->
  <g transform="translate(64, 38) scale(0.9)" filter="url(#brandSubtleGlow)">
    <!-- 45-deg square 1 -->
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="url(#brandGoldGrad)" />
    <!-- 45-deg rotated square 2 -->
    <rect x="-9" y="-9" width="18" height="18" rx="2" fill="url(#brandGoldGrad)" transform="rotate(45)" />
    <!-- Center AI Emerald Core -->
    <circle cx="0" cy="0" r="4.5" fill="#042f2e" stroke="url(#brandAiSparkGrad)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#6ee7b7" />
  </g>

  <!-- Constellation AI Neural Connection Sparks -->
  <circle cx="46" cy="46" r="1.8" fill="#6ee7b7" opacity="0.8" />
  <circle cx="82" cy="46" r="1.8" fill="#6ee7b7" opacity="0.8" />
  <path d="M48 46 L56 41" stroke="#6ee7b7" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6" />
  <path d="M80 46 L72 41" stroke="#6ee7b7" stroke-width="0.8" stroke-dasharray="1.5 1.5" opacity="0.6" />
</svg>
